apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-persistence-test
  namespace: testing
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-persistence-writer
  namespace: testing
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: nginx:stable-alpine
      command:
        - /bin/sh
        - -c
        - |
          echo "longhorn-persistence-test $(date -Iseconds)" > /data/test.txt
          sync
          cat /data/test.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-persistence-test
